<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowman Vocabulary Game - Split Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .snowman-part { transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }
        .hidden-part { opacity: 0; pointer-events: none; }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
        .letter-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: scale(0.95); }
        .word-box-active { animation: bounce 0.5s ease-in-out; }
        @keyframes bounce {
            0%, 100% { transform: translateY(-10px); }
            50% { transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-blue-400 to-cyan-300 min-h-screen flex items-center justify-center p-4">

    <div id="game-container" class="max-w-[95%] w-full bg-white/95 backdrop-blur-2xl p-8 lg:p-12 rounded-[60px] shadow-[0_25px_60px_rgba(0,0,0,0.3)] border-4 border-white">
        
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-4xl lg:text-6xl font-black text-blue-700 tracking-tighter drop-shadow-sm">SNOWMAN ☃️</h1>
                <p class="text-blue-500 font-bold text-lg lg:text-xl mt-1 uppercase tracking-widest">Business English</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="lives-counter" class="bg-blue-50 text-blue-600 px-8 py-4 rounded-3xl font-black border-4 border-blue-100 text-3xl shadow-sm transition-all duration-300">
                    Lượt: 10
                </div>
                <button id="mute-btn" onclick="toggleMute()" class="p-4 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors text-2xl">
                    <span id="mute-icon">🔊</span>
                </button>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-10 items-stretch">
            
            <!-- Cột trái: Người tuyết -->
            <div class="lg:w-1/3 bg-gradient-to-b from-blue-50 to-white rounded-[50px] border-4 border-blue-50 shadow-inner flex items-center justify-center relative min-h-[400px]">
                <svg id="snowman-svg" viewBox="0 0 200 240" class="w-full h-full max-h-[500px] p-6">
                    <ellipse id="puddle" cx="100" cy="220" rx="60" ry="10" fill="#a5f3fc" class="snowman-part hidden-part" />
                    <circle id="part-10" cx="100" cy="180" r="45" fill="white" stroke="#e2e8f0" stroke-width="2" class="snowman-part" />
                    <circle id="part-9" cx="100" cy="115" r="35" fill="white" stroke="#e2e8f0" stroke-width="2" class="snowman-part" />
                    <circle id="part-8" cx="100" cy="65" r="25" fill="white" stroke="#e2e8f0" stroke-width="2" class="snowman-part" />
                    <g id="part-7" class="snowman-part">
                        <circle cx="92" cy="60" r="2" fill="#334155" />
                        <circle cx="108" cy="60" r="2" fill="#334155" />
                        <path d="M 95 72 Q 100 78 105 72" stroke="#334155" fill="none" stroke-width="2" />
                        <path d="M 100 65 L 115 68 L 100 71 Z" fill="#fb923c" />
                    </g>
                    <circle id="part-6" cx="100" cy="105" r="3" fill="#ef4444" class="snowman-part" />
                    <circle id="part-5" cx="100" cy="115" r="3" fill="#f59e0b" class="snowman-part" />
                    <circle id="part-4" cx="100" cy="125" r="3" fill="#10b981" class="snowman-part" />
                    <path id="part-3" d="M 65 110 L 30 90" stroke="#78350f" stroke-width="4" stroke-linecap="round" class="snowman-part" />
                    <path id="part-2" d="M 135 110 L 170 90" stroke="#78350f" stroke-width="4" stroke-linecap="round" class="snowman-part" />
                    <g id="part-1" class="snowman-part">
                        <rect x="70" y="40" width="60" height="5" rx="2" fill="#1e293b" />
                        <rect x="80" y="20" width="40" height="20" rx="2" fill="#1e293b" />
                    </g>
                </svg>
            </div>

            <!-- Cột phải: Đoán từ và Bàn phím -->
            <div class="lg:w-2/3 flex flex-col justify-between space-y-8">
                
                <!-- Hiển thị từ vựng -->
                <div id="word-display" class="flex flex-wrap justify-center gap-4 min-h-[120px] items-center"></div>

                <div class="flex justify-end">
                    <!-- Nút CHÍNH XÁC - Đặt gọn bên phải -->
                    <button id="reveal-btn" onclick="revealSolution()" class="bg-green-500 hover:bg-green-600 text-white font-black py-4 px-10 rounded-2xl shadow-[0_8px_0_rgb(21,128,61)] border-2 border-green-400 text-xl transition-all hover:-translate-y-1 active:translate-y-2 active:shadow-none animate-pulse-soft">
                        ✅ CHÍNH XÁC!
                    </button>
                </div>

                <!-- Bàn phím -->
                <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-3"></div>
            </div>
        </div>
    </div>

    <div id="success-modal" class="fixed inset-0 bg-blue-900/60 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="bg-white p-12 lg:p-16 rounded-[60px] shadow-2xl max-w-2xl w-full text-center border-8 border-blue-50 transform scale-90 transition-transform duration-500">
            <div class="text-7xl mb-6">🌟</div>
            <h2 class="text-2xl text-blue-500 font-bold uppercase tracking-widest mb-2">Đoán đúng rồi!</h2>
            <div id="final-word" class="text-6xl lg:text-8xl font-black text-blue-700 mb-6 uppercase tracking-tighter"></div>
            <div id="word-meaning" class="text-2xl lg:text-3xl text-slate-600 font-medium italic mb-10 bg-blue-50 py-6 px-8 rounded-3xl"></div>
            <button onclick="nextLevel()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-2xl transition-all active:scale-95">
                SANG TỪ TIẾP THEO
            </button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "percent", meaning: "Phần trăm (%)" },
            { word: "instead of", meaning: "Thay vì, thay cho" },
            { word: "attractive", meaning: "Lôi cuốn, hấp dẫn" },
            { word: "avoid", meaning: "Tránh xa, ngăn ngừa" },
            { word: "stores", meaning: "Các cửa hàng" },
            { word: "control", meaning: "Kiểm soát, điều khiển" },
            { word: "habit", meaning: "Thói quen" },
            { word: "item", meaning: "Món hàng, vật phẩm" },
            { word: "strategy", meaning: "Chiến lược" },
            { word: "enter", meaning: "Đi vào, nhập vào" },
            { word: "customer", meaning: "Khách hàng" },
            { word: "aisle", meaning: "Lối đi (giữa các dãy kệ hàng)" },
            { word: "rationally", meaning: "Một cách có lý trí" },
            { word: "cash register", meaning: "Máy tính tiền" }
        ];

        let selectedWord = "";
        let selectedMeaning = "";
        let guessedLetters = [];
        let lives = 10;
        let isMuted = false;
        let audioInitialized = false;
        let polySynth, noiseSynth, simpleSynth;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            polySynth = new Tone.PolySynth().toDestination();
            noiseSynth = new Tone.NoiseSynth({ envelope: { attack: 0.01, decay: 0.1, sustain: 0 } }).toDestination();
            simpleSynth = new Tone.Synth().toDestination();
            audioInitialized = true;
        }

        function playCorrect() { if (!isMuted && audioInitialized) polySynth.triggerAttackRelease(["C5", "E5"], "8n"); }
        function playWrong() { if (!isMuted && audioInitialized) noiseSynth.triggerAttackRelease("16n"); }
        function playWin() { if (!isMuted && audioInitialized) { const now = Tone.now(); polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n", now); } }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-icon').textContent = isMuted ? "🔇" : "🔊";
        }

        function initGame() {
            const randomObj = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            selectedWord = randomObj.word.toLowerCase();
            selectedMeaning = randomObj.meaning;
            guessedLetters = [];
            lives = 10;

            const counter = document.getElementById('lives-counter');
            counter.textContent = `Lượt: ${lives}`;
            counter.classList.remove('text-red-600', 'animate-pulse', 'border-red-200');
            
            document.querySelectorAll('.snowman-part').forEach(p => p.classList.remove('hidden-part'));
            document.getElementById('puddle').classList.add('hidden-part');
            
            renderWord();
            renderKeyboard();
            hideSuccess();
        }

        function renderWord() {
            const display = document.getElementById('word-display');
            display.innerHTML = "";
            [...selectedWord].forEach(char => {
                const span = document.createElement('span');
                if (char === " ") {
                    span.className = "w-10 sm:w-16";
                    span.textContent = "";
                } else {
                    span.className = "w-14 h-20 lg:w-20 lg:h-28 border-b-8 border-blue-100 flex items-center justify-center text-5xl lg:text-7xl font-black text-slate-700 uppercase transition-all duration-300 mx-1";
                    if (guessedLetters.includes(char)) {
                        span.textContent = char;
                        span.classList.add('text-blue-600', 'border-blue-600', 'word-box-active');
                    }
                }
                display.appendChild(span);
            });
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = "";
            "abcdefghijklmnopqrstuvwxyz".split('').forEach(l => {
                const btn = document.createElement('button');
                btn.textContent = l;
                btn.className = "letter-btn uppercase p-3 lg:p-5 bg-white border-4 border-blue-50 rounded-2xl font-black shadow-sm hover:bg-blue-50 text-xl lg:text-3xl text-slate-600 active:scale-90 transition-all";
                if (guessedLetters.includes(l)) btn.disabled = true;
                btn.onclick = async () => {
                    await initAudio();
                    handleGuess(l, btn);
                };
                kb.appendChild(btn);
            });
        }

        function handleGuess(letter, btn) {
            if (guessedLetters.includes(letter) || lives <= 0) return;
            guessedLetters.push(letter);
            btn.disabled = true;

            if (selectedWord.includes(letter)) {
                btn.classList.add('bg-green-100', 'border-green-300', 'text-green-700');
                playCorrect();
                renderWord();
                checkWin();
            } else {
                btn.classList.add('bg-red-100', 'border-red-300', 'text-red-700');
                lives--;
                playWrong();
                updateSnowmanUI();
                checkLoss();
            }
        }

        function updateSnowmanUI() {
            const counter = document.getElementById('lives-counter');
            counter.textContent = `Lượt: ${lives}`;
            
            const partToHide = document.getElementById(`part-${11 - (10 - lives)}`);
            if (partToHide) partToHide.classList.add('hidden-part');

            if (lives <= 3) {
                counter.classList.add('text-red-600', 'border-red-200', 'animate-pulse');
            }
        }

        function checkWin() {
            const lettersOnly = selectedWord.replace(/\s/g, '');
            const isWon = [...lettersOnly].every(l => guessedLetters.includes(l));
            if (isWon) {
                // Tự động hiện bảng sau một lúc nếu học sinh tự đoán đúng hết
                setTimeout(showSuccess, 800);
            }
        }

        function checkLoss() {
            if (lives <= 0) {
                document.getElementById('puddle').classList.remove('hidden-part');
                guessedLetters = [...selectedWord]; // Hiện đáp án
                renderWord();
                setTimeout(() => {
                    alert(`Rất tiếc! Người tuyết đã tan chảy. Đáp án là: ${selectedWord.toUpperCase()}`);
                    initGame();
                }, 1000);
            }
        }

        function revealSolution() {
            initAudio();
            guessedLetters = [...selectedWord];
            renderWord();
            setTimeout(showSuccess, 600);
        }

        function showSuccess() {
            playWin();
            const modal = document.getElementById('success-modal');
            document.getElementById('final-word').textContent = selectedWord;
            document.getElementById('word-meaning').textContent = selectedMeaning;
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-90');
        }

        function hideSuccess() {
            const modal = document.getElementById('success-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-90');
        }

        function nextLevel() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
