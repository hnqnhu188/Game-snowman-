<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowman Vocabulary - Teacher Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f9ff; }
        .melting-part { transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; }
        .hidden-part { opacity: 0; transform: translateY(10px) scale(0.9); pointer-events: none; }
        .letter-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .snow-bg { background: radial-gradient(circle at center, #ffffff 0%, #e0f2fe 100%); }
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 snow-bg">

<div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center text-center">
        <div class="text-5xl mb-4">🌟</div>
        <h2 class="text-sm font-bold text-blue-500 uppercase tracking-widest mb-1">Từ vựng là:</h2>
        <h1 id="modal-word-text" class="text-4xl font-black text-slate-800 mb-3 break-all uppercase">WORD</h1>
        <div class="w-full h-px bg-slate-100 my-4"></div>
        <p id="modal-meaning-text" class="text-xl text-blue-600 font-semibold mb-8 px-4 italic underline decoration-blue-200">Nghĩa là: ...</p>
        <button id="modal-next-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95">
            Tiếp tục ván mới ➔
        </button>
    </div>
</div>

<div id="game-container" class="max-w-2xl w-full bg-white/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border border-blue-100 flex flex-col items-center">
    
    <div class="w-full flex justify-between items-start mb-4">
        <div class="text-left">
            <h1 class="text-2xl sm:text-3xl font-black text-blue-600">Snowman ☃️</h1>
            <p class="text-slate-500 italic text-xs sm:text-sm">Business & Shopping Vocab</p>
        </div>
        <div class="flex flex-col items-end gap-2">
            <div id="lives-counter" class="bg-orange-100 text-orange-600 px-4 py-1 rounded-full font-bold border border-orange-200 text-sm">
                Còn lại: 10 lượt
            </div>
            <button id="mute-btn" class="p-2 bg-blue-100 rounded-full hover:bg-blue-200 transition-colors">
                <span id="mute-icon">🔊</span>
            </button>
        </div>
    </div>

    <div class="relative w-64 h-72 mb-8 bg-blue-50 rounded-2xl flex items-center justify-center overflow-hidden border-2 border-blue-100">
        <div class="absolute top-2 right-2 text-yellow-400">
            <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.243 1.757a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-2.757 4.243a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 010-1.414zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zm-4.243-1.757a1 1 0 010-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM3 10a1 1 0 011-1h1a1 1 0 110 2H4a1 1 0 01-1-1zm1.757-4.243a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM10 7a3 3 0 100 6 3 3 0 000-6z"></path></svg>
        </div>

        <svg viewBox="0 0 200 240" class="w-48 h-60">
            <rect id="part-10" class="melting-part" x="80" y="10" width="40" height="25" fill="#334155" /> <!-- Hat Top -->
            <rect id="part-9" class="melting-part" x="70" y="35" width="60" height="5" fill="#334155" rx="2" /> <!-- Hat Brim -->
            <line id="part-8" class="melting-part" x1="160" y1="120" x2="130" y2="135" stroke="#5d4037" stroke-width="4" stroke-linecap="round" /> <!-- Right Arm -->
            <line id="part-7" class="melting-part" x1="40" y1="120" x2="70" y2="135" stroke="#5d4037" stroke-width="4" stroke-linecap="round" /> <!-- Left Arm -->
            <circle id="part-6" class="melting-part" cx="100" cy="130" r="3" fill="#ef4444" /> <!-- Button 3 -->
            <circle id="part-5" class="melting-part" cx="100" cy="150" r="3" fill="#f59e0b" /> <!-- Button 2 -->
            <circle id="part-4" class="melting-part" cx="100" cy="170" r="3" fill="#3b82f6" /> <!-- Button 1 -->
            <g id="part-3" class="melting-part"> <!-- Face -->
                <circle cx="93" cy="65" r="2.5" fill="#334155" />
                <circle cx="107" cy="65" r="2.5" fill="#334155" />
                <path d="M100 68 L115 72 L100 76 Z" fill="#fb923c" />
            </g>
            <circle id="part-2" class="melting-part" cx="100" cy="75" r="25" fill="white" stroke="#cbd5e1" stroke-width="2" /> <!-- Head -->
            <g id="part-1" class="melting-part"> <!-- Body -->
                <circle cx="100" cy="135" r="35" fill="white" stroke="#cbd5e1" stroke-width="2" />
                <circle cx="100" cy="200" r="45" fill="white" stroke="#cbd5e1" stroke-width="2" />
            </g>
        </svg>

        <div id="puddle" class="absolute bottom-4 hidden opacity-0 transition-opacity duration-1000">
             <svg width="140" height="40" viewBox="0 0 140 40">
                <ellipse cx="70" cy="20" rx="65" ry="15" fill="#e2e8f0" />
                <ellipse cx="70" cy="20" rx="50" ry="10" fill="#f8fafc" />
             </svg>
        </div>
    </div>

    <div id="word-display" class="flex flex-wrap justify-center gap-2 mb-8 min-h-[40px]"></div>

    <div class="mb-6 w-full flex justify-end pr-2">
        <button id="quick-correct-btn" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-2xl shadow-lg border-b-4 border-green-700 transition-all hover:-translate-y-1 active:translate-y-0 active:border-b-0 flex items-center gap-2 animate-pulse-soft text-sm sm:text-base">
            <span>✅ CHÍNH XÁC!</span>
            <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-md hidden sm:inline-block">(Hiện từ)</span>
        </button>
    </div>

    <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-2 w-full max-w-md"></div>

    <div id="message-container" class="mt-8 hidden flex flex-col items-center">
        <p id="game-status-text" class="text-xl font-bold mb-4"></p>
        <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold shadow-lg transform transition hover:scale-105 active:scale-95">
            Chơi ván mới 🔄
        </button>
    </div>
</div>

<script>
const VOCABULARY = [
    { word: "percent", meaning: "Phần trăm" },
    { word: "instead of", meaning: "Thay vì / Thay cho" },
    { word: "attractive", meaning: "Lôi cuốn / Hấp dẫn" },
    { word: "avoid", meaning: "Tránh / Tránh xa" },
    { word: "stores", meaning: "Các cửa hàng" },
    { word: "control", meaning: "Kiểm soát / Điều khiển" },
    { word: "habit", meaning: "Thói quen" },
    { word: "item", meaning: "Món đồ / Vật phẩm" },
    { word: "strategy", meaning: "Chiến lược" },
    { word: "enter", meaning: "Đi vào / Nhập vào" },
    { word: "customer", meaning: "Khách hàng" },
    { word: "product", meaning: "Sản phẩm" },
    { word: "cash register", meaning: "Máy tính tiền" }
];

let currentWordObj = {};
let selectedWord = "";
let guessedLetters = [];
let mistakes = 0;
const MAX_MISTAKES = 10;
let isMuted = false;
let audioInitialized = false;

let polySynth, noiseSynth, synth;

async function initAudio() {
    if (audioInitialized) return;
    try {
        await Tone.start();
        polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
        noiseSynth = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0 }
        }).toDestination();
        synth = new Tone.Synth().toDestination();
        audioInitialized = true;
    } catch (e) {}
}

function playCorrectSound() { if (!isMuted && audioInitialized) polySynth.triggerAttackRelease(["E5", "G5"], "16n"); }
function playWrongSound() { if (!isMuted && audioInitialized) noiseSynth.triggerAttackRelease("16n"); }
function playWinSound() {
    if (isMuted || !audioInitialized) return;
    const now = Tone.now();
    polySynth.triggerAttackRelease("C5", "8n", now);
    polySynth.triggerAttackRelease("E5", "8n", now + 0.1);
    polySynth.triggerAttackRelease("G5", "8n", now + 0.2);
    polySynth.triggerAttackRelease("C6", "4n", now + 0.3);
}
function playLossSound() { if (!isMuted && audioInitialized) synth.triggerAttackRelease("G2", "2n"); }

function initGame() {
    currentWordObj = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
    selectedWord = currentWordObj.word.toLowerCase();
    guessedLetters = [];
    mistakes = 0;

    document.getElementById('message-container').classList.add('hidden');
    document.getElementById('success-modal').classList.add('hidden', 'opacity-0');
    document.getElementById('quick-correct-btn').classList.remove('hidden', 'opacity-50');
    document.getElementById('keyboard').classList.remove('pointer-events-none', 'opacity-50');
    document.getElementById('puddle').classList.add('hidden');
    document.getElementById('puddle').classList.remove('opacity-100');
    
    updateCountdown();

    for (let i = 1; i <= MAX_MISTAKES; i++) {
        const part = document.getElementById(`part-${i}`);
        if (part) part.classList.remove('hidden-part');
    }

    renderWord();
    renderKeyboard();
}

function updateCountdown() {
    const remaining = MAX_MISTAKES - mistakes;
    const counterEl = document.getElementById('lives-counter');
    counterEl.textContent = `Còn lại: ${remaining} lượt`;
    if (remaining <= 3) {
        counterEl.className = "bg-red-100 text-red-600 px-4 py-1 rounded-full font-bold border border-red-200 animate-pulse";
    } else {
        counterEl.className = "bg-orange-100 text-orange-600 px-4 py-1 rounded-full font-bold border border-orange-200 text-sm";
    }
}

function renderWord() {
    const display = document.getElementById('word-display');
    display.innerHTML = "";
    [...selectedWord].forEach(char => {
        const span = document.createElement('span');
        span.className = "w-7 h-9 border-b-2 border-blue-200 flex items-center justify-center text-xl font-bold text-slate-700 uppercase mx-0.5";
        if (char === " ") {
            span.textContent = "";
            span.className = "w-4 h-9";
        } else if (guessedLetters.includes(char)) {
            span.textContent = char;
            span.classList.add('text-blue-600', 'border-blue-500');
        } else {
            span.textContent = "";
        }
        display.appendChild(span);
    });
}

function renderKeyboard() {
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = "";
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    alphabet.split('').forEach(letter => {
        const btn = document.createElement('button');
        btn.textContent = letter;
        btn.className = "letter-btn uppercase p-2 bg-white border border-blue-100 rounded-lg font-bold shadow-sm hover:bg-blue-50 hover:border-blue-300 transition-all text-slate-600 active:scale-90 text-sm";
        btn.onclick = async () => {
            await initAudio();
            handleGuess(letter, btn);
        };
        keyboard.appendChild(btn);
    });
}

function handleGuess(letter, btn) {
    if (guessedLetters.includes(letter) || mistakes >= MAX_MISTAKES) return;
    guessedLetters.push(letter);
    btn.disabled = true;

    if (selectedWord.includes(letter)) {
        btn.classList.add('bg-green-500', 'text-white', 'border-green-600');
        playCorrectSound();
        renderWord();
        checkWin();
    } else {
        btn.classList.add('bg-red-400', 'text-white', 'border-red-500');
        playWrongSound();
        mistakes++;
        updateCountdown();
        meltSnowman(mistakes);
        checkLoss();
    }
}

function meltSnowman(mistakeCount) {
    const partId = `part-${11 - mistakeCount}`;
    const part = document.getElementById(partId);
    if (part) part.classList.add('hidden-part');
}

function checkWin() {
    const isWon = [...selectedWord].every(char => char === " " || guessedLetters.includes(char));
    if (isWon) {
        showSuccess();
    }
}

async function showSuccess() {
    await initAudio();
    playWinSound();
    
    // Reveal all letters
    guessedLetters = selectedWord.split("");
    renderWord();
    
    document.getElementById('keyboard').classList.add('pointer-events-none', 'opacity-50');
    document.getElementById('quick-correct-btn').classList.add('opacity-50', 'pointer-events-none');
    
    const modal = document.getElementById('success-modal');
    document.getElementById('modal-word-text').textContent = selectedWord;
    document.getElementById('modal-meaning-text').textContent = `Nghĩa là: ${currentWordObj.meaning}`;
    modal.classList.remove('hidden');
    setTimeout(() => modal.classList.remove('opacity-0'), 10);
}

function checkLoss() {
    if (mistakes >= MAX_MISTAKES) {
        playLossSound();
        document.getElementById('puddle').classList.remove('hidden');
        setTimeout(() => document.getElementById('puddle').classList.add('opacity-100'), 100);
        document.getElementById('game-status-text').textContent = `Ôi không! Từ đúng là: ${selectedWord.toUpperCase()}`;
        document.getElementById('game-status-text').className = "text-xl font-bold mb-4 text-red-500";
        document.getElementById('message-container').classList.remove('hidden');
        document.querySelectorAll('.letter-btn').forEach(btn => btn.disabled = true);
        document.getElementById('quick-correct-btn').classList.add('hidden');
    }
}

document.getElementById('quick-correct-btn').onclick = showSuccess;
document.getElementById('modal-next-btn').onclick = initGame;
document.getElementById('restart-btn').onclick = initGame;
document.getElementById('mute-btn').onclick = () => {
    isMuted = !isMuted;
    document.getElementById('mute-icon').textContent = isMuted ? "🔇" : "🔊";
};

window.onload = initGame;
</script>
</body>
</html>
